name: Build, Test & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

# Superseded runs of the same branch or tag are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The update check compares the tag on GitHub against the version compiled
  # into the binary. If they drift, every user gets an endless "update
  # available" announcement for a build they already have, so refuse to release.
  verify-version:
    name: Verify tag matches project version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compare tag with project(EWR VERSION ...)
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        project_version="$(sed -n 's/^project(EWR VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"

        echo "Tag version:     $tag_version"
        echo "Project version: $project_version"

        if [ -z "$project_version" ]; then
          echo "::error::Could not read the version from CMakeLists.txt"
          exit 1
        fi

        # Pre-release tags such as v1.3.0-rc.1 must share the numeric core.
        if [ "${tag_version%%-*}" != "$project_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match project(EWR VERSION $project_version). Bump CMakeLists.txt before tagging."
          exit 1
        fi

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libcurl4-openssl-dev pkg-config

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew list libusb >/dev/null 2>&1 || brew install libusb

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DEWR_BUILD_TESTS=ON

    - name: Build project
      run: cmake --build build --config Release

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Publish test summary
      if: always()
      shell: bash
      run: |
        echo "## Test summary for ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Runner OS**: ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish draft release
    needs: [verify-version, build-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libcurl4-openssl-dev pkg-config

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew list libusb >/dev/null 2>&1 || brew install libusb

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DEWR_BUILD_TESTS=OFF

    - name: Build project
      run: cmake --build build --config Release

    # Releases ship as archives (EWR announces new versions; installing is up
    # to the user). Names follow the existing EWR-<tag>-<os> convention. The
    # macOS archive carries the machine type because the hosted runner is
    # arm64 and the binary is not universal.
    - name: Package release artifacts
      shell: bash
      run: |
        mkdir -p dist EWR
        case "${{ runner.os }}" in
          Windows)
            cp ewr.exe database.json EWR/
            7z a "dist/EWR-${GITHUB_REF_NAME}-win.zip" EWR
            ;;
          macOS)
            cp ewr database.json EWR/
            tar -czf "dist/EWR-${GITHUB_REF_NAME}-macos-$(uname -m).tar.gz" EWR
            ;;
          *)
            cp ewr database.json EWR/
            tar -czf "dist/EWR-${GITHUB_REF_NAME}-linux.tar.gz" EWR
            ;;
        esac
        ls -l dist

    - name: Upload artifacts to draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
